<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel - QuizMaster Pro</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            text-align: center;
            padding: 20px;
            border-bottom: 2px solid white;
        }

        .container {
            max-width: 850px;
            margin: 30px auto;
            background: white;
            color: black;
            padding: 25px;
            border-radius: 12px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid black;
            border-radius: 6px;
        }

        button {
            padding: 12px 18px;
            background: black;
            color: white;
            border: 2px solid black;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background: white;
            color: black;
        }

        .question-card {
            border: 1px solid black;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
        }

        .question-card p {
            margin: 8px 0;
        }

        .edit-btn {
            background: #444;
        }

        .delete-btn {
            background: #000;
        }

        #message {
            font-weight: bold;
            text-align: center;
        }

        .back {
            display: block;
            text-align: center;
            color: black;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>QuizMaster Pro</h1>
    <h2>Admin Panel</h2>
    <p>Manage Your Quiz Questions</p>
</header>

<div class="container">

    <h2>Add New Question</h2>

    <form id="questionForm">

        <label>Choose Subject</label>

        <select id="subject" required>
            <option value="Computer Science">Computer Science</option>
            <option value="English">English</option>
            <option value="Mathematics">Mathematics</option>
        </select>

        <label>Enter Question</label>
        <input type="text" id="question"
        placeholder="Write your question" required>

        <label>Option 1</label>
        <input type="text" id="option1" required>

        <label>Option 2</label>
        <input type="text" id="option2" required>

        <label>Option 3</label>
        <input type="text" id="option3" required>

        <label>Option 4</label>
        <input type="text" id="option4" required>

        <label>Correct Answer</label>

        <select id="answer" required>
            <option value="0">Option 1</option>
            <option value="1">Option 2</option>
            <option value="2">Option 3</option>
            <option value="3">Option 4</option>
        </select>

        <button type="submit" id="saveBtn">
            Add Question
        </button>

        <button type="button" onclick="resetForm()">
            Clear Form
        </button>

    </form>

    <p id="message"></p>

    <hr>

    <h2>All Questions</h2>

    <div id="questionList"></div>

    <a href="dashboard.html" class="back">
        Back to Dashboard
    </a>

</div>

<script>

    let questions = JSON.parse(
        localStorage.getItem("customQuestions")
    ) || [];

    let editIndex = -1;

    const form = document.getElementById("questionForm");

    function saveQuestions() {
        localStorage.setItem(
            "customQuestions",
            JSON.stringify(questions)
        );
    }

    function showQuestions() {

        let list = document.getElementById("questionList");

        list.innerHTML = "";

        if (questions.length === 0) {
            list.textContent = "No questions added yet.";
            return;
        }

        questions.forEach(function(item, index) {

            let card = document.createElement("div");
            card.className = "question-card";

            let heading = document.createElement("h3");
            heading.textContent =
                (index + 1) + ". " + item.question;

            card.appendChild(heading);

            let subject = document.createElement("p");
            subject.textContent = "Subject: " + item.subject;
            card.appendChild(subject);

            item.options.forEach(function(option, i) {
                let p = document.createElement("p");

                p.textContent =
                    "Option " + (i + 1) + ": " + option;

                card.appendChild(p);
            });

            let correct = document.createElement("p");

            correct.textContent =
                "Correct Answer: " +
                item.options[item.answer];

            card.appendChild(correct);

            let editButton = document.createElement("button");
            editButton.textContent = "Edit";
            editButton.className = "edit-btn";

            editButton.onclick = function() {
                editQuestion(index);
            };

            card.appendChild(editButton);

            let deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.className = "delete-btn";

            deleteButton.onclick = function() {
                deleteQuestion(index);
            };

            card.appendChild(deleteButton);

            list.appendChild(card);

        });
    }

    form.addEventListener("submit", function(event) {

        event.preventDefault();

        let newQuestion = {
            subject: document.getElementById("subject").value,

            question: document.getElementById("question").value,

            options: [
                document.getElementById("option1").value,
                document.getElementById("option2").value,
                document.getElementById("option3").value,
                document.getElementById("option4").value
            ],

            answer: Number(
                document.getElementById("answer").value
            )
        };

        if (editIndex === -1) {

            questions.push(newQuestion);

            document.getElementById("message").textContent =
                "Question Added Successfully!";

        } else {

            questions[editIndex] = newQuestion;

            document.getElementById("message").textContent =
                "Question Updated Successfully!";

            editIndex = -1;
        }

        saveQuestions();
        showQuestions();
        resetForm();

    });

    function editQuestion(index) {

        let item = questions[index];

        document.getElementById("subject").value =
            item.subject;

        document.getElementById("question").value =
            item.question;

        document.getElementById("option1").value =
            item.options[0];

        document.getElementById("option2").value =
            item.options[1];

        document.getElementById("option3").value =
            item.options[2];

        document.getElementById("option4").value =
            item.options[3];

        document.getElementById("answer").value =
            item.answer;

        editIndex = index;

        document.getElementById("saveBtn").textContent =
            "Update Question";

        window.scrollTo(0, 0);
    }

    function deleteQuestion(index) {

        if (confirm("Are you sure you want to delete this question?")) {

            questions.splice(index, 1);

            saveQuestions();
            showQuestions();

            document.getElementById("message").textContent =
                "Question Deleted Successfully!";
        }
    }

    function resetForm() {

        form.reset();

        editIndex = -1;

        document.getElementById("saveBtn").textContent =
            "Add Question";
    }

    showQuestions();

</script>

</body>
</html>
